name: User database persistence tests

on:
  push:
    branches:
      - main
      - feat/04-sqlite-persistence
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore UserManagementAPI.slnx
      - name: Build and test
        run: dotnet test UserManagementAPI.slnx --configuration Release --no-restore --verbosity normal
