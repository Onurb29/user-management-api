name: API build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore UserManagementAPI.slnx
      - name: Build
        run: dotnet build UserManagementAPI.slnx --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test UserManagementAPI.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 7
